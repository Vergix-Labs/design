<!-- @dsCard group="Cores" viewport="700x168" name="Ink — carvão frio" subtitle="Fundo de marca + texto. A base neutra fria do símbolo." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);color:var(--text)}
  .row{display:flex;gap:0;padding:20px}
  .sw{flex:1;height:108px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
  .sw:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
  .sw:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .n{font-size:11px;font-weight:600;letter-spacing:.02em}
  .h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink-950);color:#cfd2d8"><span class="n">950</span><span class="h">#121317</span></div>
    <div class="sw" style="background:var(--ink-800);color:#cfd2d8"><span class="n">800</span><span class="h">#1f2127</span></div>
    <div class="sw" style="background:var(--ink-600);color:#e6e8ec"><span class="n">600</span><span class="h">#3c4049</span></div>
    <div class="sw" style="background:var(--ink-400);color:#fff"><span class="n">400</span><span class="h">#797f8a</span></div>
    <div class="sw" style="background:var(--ink-300);color:#1f2127"><span class="n">300</span><span class="h">#9aa0aa</span></div>
    <div class="sw" style="background:var(--ink-200);color:#1f2127"><span class="n">200</span><span class="h">#d2d5db</span></div>
    <div class="sw" style="background:var(--ink-100);color:#1f2127"><span class="n">100</span><span class="h">#ececee</span></div>
    <div class="sw" style="background:var(--ink-50);color:#1f2127;border:1px solid var(--border-soft)"><span class="n">50</span><span class="h">#f4f5f6</span></div>
  </div>
</body>
</html>
