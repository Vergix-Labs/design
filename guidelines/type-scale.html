<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);color:var(--text);padding:18px 26px}
  .scale{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  .scale span{color:var(--text-strong);font-weight:600}
  .labels{display:flex;gap:18px;margin-top:16px}
  .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--text-hint);margin-top:12px}
</style>
</head>
<body>
  <div class="scale">
    <span style="font-size:36px;font-family:var(--font-serif)">Aa</span>
    <span style="font-size:26px;font-family:var(--font-serif)">Aa</span>
    <span style="font-size:20px">Aa</span>
    <span style="font-size:17px">Aa</span>
    <span style="font-size:15px">Aa</span>
    <span style="font-size:13px">Aa</span>
    <span style="font-size:11px">Aa</span>
  </div>
  <div class="labels">
    <span class="lab">Complexidade</span>
    <span class="lab">Orçamento de recursos</span>
    <span class="lab">Gate 1</span>
  </div>
  <div class="meta">11 · 13 · 15 · 17 · 20 · 26 · 36 px  ·  labels: tracking 0.08em</div>
</body>
</html>
