<!-- @dsCard group="Marca" viewport="700x230" name="Princípio-assinatura" subtitle="A IA amplia; o humano decide. O contraste de cor IA-fria / gate-quente carrega a ideia." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--brand-bg);color:var(--brand-text);padding:26px 28px}
  .q{font-family:var(--font-serif);font-size:25px;font-weight:500;line-height:1.3;letter-spacing:-.01em;max-width:560px}
  .q .ai{color:var(--slate-300)}
  .q .hu{color:var(--amber-300)}
  .row{display:flex;gap:8px;margin-top:18px}
  .b{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-pill);padding:4px 12px;font-size:11px;font-weight:600;letter-spacing:.02em}
  .b-ai{background:rgba(108,143,189,.18);color:var(--slate-300);border:1px solid rgba(108,143,189,.35)}
  .b-gate{background:rgba(207,154,95,.16);color:var(--amber-300);border:1px solid rgba(207,154,95,.4)}
  .b-art{background:rgba(255,255,255,.06);color:var(--brand-muted);border:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
  <p class="q">A <span class="ai">IA amplia</span> o volume das opções; o <span class="hu">humano decide</span> nos quatro gates.</p>
  <div class="row">
    <span class="b b-ai">IA · rascunho</span>
    <span class="b b-gate">GATE · aval humano</span>
    <span class="b b-art">artefato</span>
  </div>
</body>
</html>
