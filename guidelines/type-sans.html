<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);color:var(--text);padding:22px 26px}
  .h{font-size:20px;font-weight:600;color:var(--text-strong)}
  .b{font-size:15px;font-weight:400;line-height:1.5;color:var(--text);max-width:560px;margin-top:6px}
  .sm{font-size:13px;color:var(--text-muted);margin-top:8px}
  .wts{display:flex;gap:16px;margin-top:14px;align-items:baseline}
  .wts span{font-size:18px}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--text-hint);margin-top:12px}
</style>
</head>
<body>
  <div class="h">Escopo &amp; Intensidade da sessão</div>
  <div class="b">Os agentes pontuam a complexidade e recomendam a intensidade; o facilitador confirma o gear da sessão.</div>
  <div class="sm">ambiguidade · nº de opções · stakeholders · risco · horizonte</div>
  <div class="wts">
    <span style="font-weight:400">Regular</span>
    <span style="font-weight:500">Medium</span>
    <span style="font-weight:600">Semibold</span>
    <span style="font-weight:700">Bold</span>
    <span style="font-weight:800">Black</span>
  </div>
  <div class="meta">Hanken Grotesk · 400 500 600 700 800</div>
</body>
</html>
