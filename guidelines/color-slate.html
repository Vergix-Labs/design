<!-- @dsCard group="Cores" viewport="700x180" name="Slate — os agentes / IA" subtitle="A zona da IA: amplia e acelera. Máquina fria vs. humano quente." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);color:var(--text)}
  .row{display:flex;gap:0;padding:20px 20px 8px}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;box-sizing:border-box}
  .sw:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
  .sw:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .n{font-size:11px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:10px;opacity:.85;margin-top:2px}
  .use{display:flex;gap:8px;align-items:center;padding:0 20px 18px}
  .ai{display:inline-flex;align-items:center;gap:6px;background:var(--ai-bg);color:var(--ai-text);border:1px solid var(--ai-border);border-radius:var(--radius-pill);padding:3px 11px;font-size:11px;font-weight:600;letter-spacing:.02em}
  .cap{font-size:11.5px;color:var(--text-hint)}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--slate-100);color:#184d83"><span class="n">100</span><span class="h">#e6eef7</span></div>
    <div class="sw" style="background:var(--slate-200);color:#184d83"><span class="n">200</span><span class="h">#c6d8ec</span></div>
    <div class="sw" style="background:var(--slate-300);color:#143a63"><span class="n">300</span><span class="h">#9bb6d6</span></div>
    <div class="sw" style="background:var(--slate-400);color:#fff"><span class="n">400</span><span class="h">#6c8fbd</span></div>
    <div class="sw" style="background:var(--slate-600);color:#fff"><span class="n">600 ·texto</span><span class="h">#1e60a5</span></div>
    <div class="sw" style="background:var(--slate-700);color:#fff"><span class="n">700</span><span class="h">#184d83</span></div>
  </div>
  <div class="use">
    <span class="ai">IA · rascunho</span>
    <span class="cap">a IA amplia o volume de opções</span>
  </div>
</body>
</html>
