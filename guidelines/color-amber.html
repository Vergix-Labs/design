<!-- @dsCard group="Cores" viewport="700x180" name="Âmbar — o farol / GATE humano" subtitle="O acento quente da marca. É também a cor do gate: o julgamento humano é o farol." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);color:var(--text)}
  .row{display:flex;gap:0;padding:20px 20px 8px}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;box-sizing:border-box}
  .sw:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
  .sw:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .n{font-size:11px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:10px;opacity:.85;margin-top:2px}
  .use{display:flex;gap:8px;align-items:center;padding:0 20px 18px}
  .gate{display:inline-flex;align-items:center;gap:6px;background:var(--gate-bg);color:var(--gate-text);border:1px solid var(--gate-border);border-radius:var(--radius-pill);padding:3px 11px;font-size:11px;font-weight:600;letter-spacing:.02em}
  .cap{font-size:11.5px;color:var(--text-hint)}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--amber-100);color:#7e5320"><span class="n">100</span><span class="h">#f5e8d7</span></div>
    <div class="sw" style="background:var(--amber-200);color:#5c3c16"><span class="n">200</span><span class="h">#ecd3ad</span></div>
    <div class="sw" style="background:var(--amber-300);color:#5c3c16"><span class="n">300</span><span class="h">#ddb681</span></div>
    <div class="sw" style="background:var(--amber-400);color:#fff"><span class="n">400 ·acento</span><span class="h">#cf9a5f</span></div>
    <div class="sw" style="background:var(--amber-600);color:#fff"><span class="n">600</span><span class="h">#97653a</span></div>
    <div class="sw" style="background:var(--amber-700);color:#fff"><span class="n">700 ·gate</span><span class="h">#7e5320</span></div>
  </div>
  <div class="use">
    <span class="gate">GATE · aval humano</span>
    <span class="cap">o humano decide nos pontos certos</span>
  </div>
</body>
</html>
