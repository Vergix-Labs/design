<!-- @dsCard group="Cores" viewport="700x150" name="Funcionais & superfícies" subtitle="Positivo (sobrevive), negativo (eliminado) e as superfícies de produto." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);color:var(--text)}
  .wrap{display:flex;gap:18px;padding:18px 20px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:7px;flex:1}
  .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
  .chip{display:flex;align-items:center;gap:8px;font-size:11.5px}
  .dot{width:30px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.06)}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--text-hint);margin-left:auto}
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <span class="lbl">Funcionais</span>
      <div class="chip"><span class="dot" style="background:var(--positive)"></span>positivo · sobrevive<span class="h">#2f7d5b</span></div>
      <div class="chip"><span class="dot" style="background:var(--positive-bg)"></span>positivo bg<span class="h">#e4f0ea</span></div>
      <div class="chip"><span class="dot" style="background:var(--negative)"></span>negativo · elimina<span class="h">#b1492f</span></div>
      <div class="chip"><span class="dot" style="background:var(--negative-bg)"></span>negativo bg<span class="h">#f6e6e1</span></div>
    </div>
    <div class="col">
      <span class="lbl">Superfícies</span>
      <div class="chip"><span class="dot" style="background:var(--paper)"></span>papel · canvas<span class="h">#f6f6f4</span></div>
      <div class="chip"><span class="dot" style="background:var(--white);border-color:var(--border)"></span>card<span class="h">#ffffff</span></div>
      <div class="chip"><span class="dot" style="background:var(--surface-fill)"></span>preenchimento<span class="h">#eceef0</span></div>
      <div class="chip"><span class="dot" style="background:var(--brand-bg)"></span>marca · escura<span class="h">#121317</span></div>
    </div>
  </div>
</body>
</html>
