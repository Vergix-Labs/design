<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--white);color:var(--text);padding:20px 26px}
  table{border-collapse:collapse;font-size:12.5px;width:100%}
  th,td{border:1px solid var(--border);padding:6px 9px;text-align:left}
  th{background:var(--surface-sub);color:var(--text-muted);font-weight:600;font-size:11px}
  .score{font-weight:600;color:var(--text-strong)}
  .meta{font-size:10px;color:var(--text-hint);margin-top:12px}
</style>
</head>
<body>
  <table>
    <tr><th>Opção \ Critério (peso)</th><th>C1 ·30%</th><th>C2 ·25%</th><th>C3 ·25%</th><th>Score</th></tr>
    <tr><td>Opção A</td><td>4.2</td><td>3.8</td><td>4.5</td><td class="score">4.16</td></tr>
    <tr><td>Opção B</td><td>3.1</td><td>4.0</td><td>2.9</td><td class="score">3.30</td></tr>
  </table>
  <div class="meta">Spline Sans Mono · 400 500 600 · tabular · GATE 2 · rank 1</div>
</body>
</html>
