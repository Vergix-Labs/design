<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font-sans);padding:22px 24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .span{grid-column:1/-1}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Field, Select } = window.AratekoLabsDesignSystem_0b81f3;
  function Demo(){
    return (
      <div className="grid">
        <div className="span">
          <Field label="Qual é o desafio?" multiline rows={2}
                 placeholder="Ex.: Como priorizar onde investir o próximo trimestre de produto?" />
        </div>
        <Field label="Objetivo" required placeholder="Em uma linha" defaultValue="Dobrar a retenção em 2 trimestres" />
        <Select label="Intensidade da sessão" options={['Sprint','Journey','Method','Meta']} defaultValue="Sprint" />
        <Field label="KPI (curto prazo)" placeholder="Defina um KPI" />
        <Field label="KPI (longo prazo)" invalid hint="Defina ao menos um KPI de longo prazo." />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
