<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&family=Spectral:wght@400;500;600&display=swap">
<style>
  body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font-sans);padding:24px}
  .sec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-hint);margin:0 0 10px}
  .block{margin-bottom:26px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const NS = window.AratekoLabsDesignSystem_0b81f3;
  const { PhaseStepper, GateBanner, AINote, OptionCard, ScoreTable, DecisionLog, Button } = NS;
  function Demo(){
    return (
      <div>
        <div className="block">
          <p className="sec">PhaseStepper — Funil de Valor</p>
          <PhaseStepper current={2} />
        </div>
        <div className="block">
          <p className="sec">GateBanner — decisão humana</p>
          <GateBanner gate={2}
            title="Os Decisores são donos dos pesos"
            description={<>A ordenação dos critérios <b>é</b> o funil. A IA propõe pesos e trade-offs; os humanos decidem.</>}
            actions={<><Button variant="accent" size="sm">Confirmar pesos</Button><Button variant="ghost" size="sm">Ajustar</Button></>} />
        </div>
        <div className="block">
          <p className="sec">AINote — zona de IA</p>
          <AINote actions={<><Button variant="ai" size="sm">IA: ampliar pool ↗</Button><Button variant="ai" size="sm">IA: clusterizar ↗</Button></>}>
            <b>Disciplina-assinatura:</b> gerar opções <b>e</b> critérios em paralelo. A IA amplia e agrupa; os humanos trazem o que importa.
          </AINote>
        </div>
        <div className="block">
          <p className="sec">OptionCard — board de Expandir</p>
          <div className="two">
            <OptionCard source="ia" title="Programa de indicações" body="Incentivar usuários ativos a trazerem times." tags={['crescimento','baixo custo']} />
            <OptionCard source="humano" title="Custo de implementação" rank="rank 1" body="Esforço de engenharia até o primeiro valor." />
          </div>
        </div>
        <div className="block">
          <p className="sec">ScoreTable — matriz MCDA</p>
          <ScoreTable
            criteria={[{label:'Impacto',weight:30,rank:'rank 1'},{label:'Esforço',weight:25,rank:'rank 2'},{label:'Risco',weight:25,rank:'rank 3'},{label:'Fit',weight:20,rank:'rank 4'}]}
            options={[{name:'Opção A',scores:[4.2,3.8,4.5,4.0]},{name:'Opção B',scores:[3.1,4.0,2.9,3.5]},{name:'Opção C',scores:[3.6,3.2,3.0,4.4]}]} />
        </div>
        <div className="block">
          <p className="sec">DecisionLog — trilha auditável</p>
          <DecisionLog entries={[
            {gate:1,decision:'DNA + KPIs',options:'—',who:'Decisor',action:'confirmou'},
            {gate:2,decision:'Pesos dos critérios',options:'4 critérios',who:'Decisores',action:'sobrescreveu'},
            {gate:3,decision:'Vencedora',options:'A, B, C',who:'Facilitador',action:'confirmou'},
          ]} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
